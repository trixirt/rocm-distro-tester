services:
  dashboard:
    build:
      # Context is the local directory where this compose file lives
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: rocm-dashboard
    restart: unless-stopped
    ports:
      # Host port 5002 (PLAN §7.5.1: 5001 reserved for the infra image registry).
      # The app itself still listens on 5001 inside the container.
      - "5002:5001"
    volumes:
      # Mount the results directory from builder machine
      - /var/rocm-distro-tester/results:/var/rocm-distro-tester/results
      # Local directory mapping for development convenience.

      # Changed from '..' to '.' to correctly map the current dashboard folder into the container.
      - .:/app  
    environment:
      - RESULTS_DIR=/var/rocm-distro-tester/results
      - FLASK_DEBUG=1  # Useful for local dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/summary"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  default:
    driver: bridge
