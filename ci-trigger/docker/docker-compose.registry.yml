version: "3.8"

services:
  registry:
    image: registry:2
    container_name: rocm-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # :z = SELinux relabel for the container (Enforcing hosts: without it the
      # registry's writes to the store are denied — "mkdir permission denied" on push)
      - registry_data:/var/lib/registry:z
    healthcheck:
      # registry:2 ships no curl; wget -S exits 0 on 404 (proves HTTP + writable store)
      test: ["CMD", "wget", "-S", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/_catalog"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  registry_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/registry/docker-registry
