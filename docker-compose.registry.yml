version: "3.8"

services:
  registry:
    image: registry:2
    container_name: rocm-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/v2/_catalog"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  registry_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/registry/docker-registry
