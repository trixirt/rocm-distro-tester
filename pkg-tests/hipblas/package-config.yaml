# =============================================================================
# HIPBLAS Package Configuration for ROCm-Tester (Comprehensive Testing)
# =============================================================================
# This file defines per-distro test configuration for the hipblas ROCm package.
# UPDATED v0.1.1 - Now includes full COMPREHENSIVE testing (smoke + unit tests)

package_name: hipblas
test_type: comprehensive-tests  # Smoke tests + Full unit test suite
test_description: "Run HIPBLAS GPU operations verification and compile test.cpp"

# =============================================================================
# DISTRO-SPECIFIC CONFIGURATIONS
# Both Fedora and ArchLinux now support full smoke + unit testing
# =============================================================================

distro_configs:
  fedora:
    base_image: "fedora:rawhide"
    package_manager: "dnf"
    rocm_packages:
      - "hipblas-devel"          # HIP BLAS library development files
      - "rocblas-devel"          # ROC BLAS library (AMD implementation)
      - "rocsolver-devel"        # Solver libraries for LAPACK routines
      - "rocm-hip-devel"         # HIP toolkit development headers
      - "hip-tests"              # HIP test utilities
      - "rocminfo"               # Device information tool
    additional_packages:
      - "gcc-c++"
      - "git"
      - "cmake"
      - "ninja-build"
      - "rpmdevtools"
      - "spectool"  # Needed to extract source tarballs from RPMs
      
    test_configuration:
      # Smoke tests execution path
      smoke_test_path: "/opt/smoketests/run_comprehensive_tests.sh"
      
      # Full unit test compilation and execution
      unit_test_source_path: "/opt/hipblas-rpm/test.cpp"
      unit_test_build_script_path: "/opt/smoketests/compile_and_run_unit_tests.sh"
      
      timeout_seconds: 3600  # 1 hour for smoke + full unit tests on GPU
      gpu_device_path: "/dev/kfd"
      log_dir: "/output/test-results"

    test_coverage:
      - "smoke_test_rocm_installation"
      - "smoke_test_hipcompiler_available"  
      - "smoke_test_hipblas_libraries_installed"
      - "unit_test_hipblas_ludecomposition"
      - "unit_test_hipblas_sgetrs"
      - "unit_test_hipblas_gemm_matrix_multiply"

  archlinux:
    base_image: "archlinux:latest"
    package_manager: "pacman"
    rocm_packages:
      - "hipblas"                # Single Arch Linux pacman package
      - "rocm-toolchain"         # Complete ROCm toolchain on Arch
      - "hipcc"                  # HIP compiler
      - "rocminfo"               # Device utility
    additional_packages:
      - "base-devel"             # Core compilation tools
      - "binutils"
      - "git"
      - "pkgfile"                # Package file search tool  
      - "sed"
      
    test_configuration:
      smoke_test_path: "/opt/smoketests/run_arch_tests.sh"
      unit_test_source_path: "/opt/hipblas-arch/test.cpp"  # From gitlab source
      timeout_seconds: 3600
      gpu_device_path: "/dev/kfd"
      log_dir: "/output/test-results"

    archlinux_specific:
      alter_makepkg_euid_check: true
      update_pkgfile_db_before_build: true
      rocm_path_env: "/opt/rocm"

    test_coverage:
      - "smoke_test_rocm_installation"
      - "smoke_test_hipcompiler_available"
      - "smoke_test_hipblas_libraries_installed"
      - "archlinux_pacman_package_verification"
      - "unit_test_from_pacman_source_builds"

  ubuntu:
    # Ubuntu support coming in v0.2
    base_image: "ubuntu:latest"
    package_manager: "apt"
    rocm_packages:
      - "hipblas-dev"
      - "rocblas-dev" 
      - "libhsa-runtime64-1"
    additional_packages:
      - "build-essential"
      - "git"
      - "cmake" 
      
    test_configuration:
      smoke_test_path: "/opt/smoketests/run_tests.sh"
      timeout_seconds: 3600
      gpu_device_path: "/dev/kfd"

    test_coverage: ["pending"]

# =============================================================================
# TEST EXECUTION PARAMETERS (Unified for All Distros)  
# =============================================================================

test_execution:
  requires_gpu: true
  minimum_gpu_memory_gb: 8
  compute_capability_min: "7.0"
  
run_parameters:
  docker_base_command_template: "docker run --rm --device={GPU_DEVICE} rocmtester/{PACKAGE}-{DISTRO}:{VERSION}"

# =====================================================================
# RESULT AGGREGATION SCHEMA (Unified for All Distros)
# Now includes smoke and unit test result fields
# =============================================================================

result_schema:
  test_name: "hipblas-comprehensive-tests"
  expected_result: "PASSED"
  output_dir: "/output/test-results"
  
  # Combined results files from both smoke tests AND unit tests
  result_files:
    - filename: "comprehensive-tests-result.json"      # Fedora/Ubuntu variant (combined)
      fields:
        - name: "test_suite"
          type: "string"
          value: "hipblas-comprehensive-tests"
        - name: "components_tested" 
          type: "object"
          smoke_tests: {gpu_check, hipcc_detected, libraries_found, etc...}
          unit_tests: {source_available, compilation_success, execution_status}
          
    - filename: "unit-tests.log"                         # Compilation log for debugging
      
  archlinux_fields:
    - name: "distro_variant"
      type: "string" 
      value: "archlinux"
      
# =============================================================================
# TEST COVERAGE DOCUMENTATION  
# Each test is tracked for CI reporting and historical analysis
# =============================================================================

test_coverage_matrix:
  description: "All test categories now executed as part of comprehensive suite"
  smoke_tests:
    - GPU device detectability in container environment
    - ROCm installation verification (all libs present and loadable)
    - HIP compiler (hipcc) availability and functionality  
    - HIPBLAS runtime libraries presence check
    - Development headers availability validation
    
  unit_tests:
    - HIPBLAS LUDecomposition routine execution (SGETRF)
    - SGETRS linear system solving verification
    - SGEMM matrix multiplication correctness check  
    - Error tolerance and numerical accuracy validation
  
test_execution_flow:
  description: "Tests run in sequential order within single container lifecycle"
  phases:
    - name: "Smoke Testing Phase" 
      description: "Initial installation verification"
      step_timeout_seconds: 300
    - name: "Unit Test Compilation Phase"
      description: "Compile hipblas.cpp with ROCm linkage"
      dependency: smoketest_phase_complete
      timeout_seconds: 600
    - name: "Unit Test Execution Phase" 
      description: "Run compiled tests on GPU hardware"
      depends_on: compilation_phase_complete
      timeout_seconds: 3600
   
